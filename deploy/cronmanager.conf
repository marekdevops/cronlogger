# /etc/nginx/conf.d/cronmanager.conf
# Konfiguracja nginx — reverse proxy dla CronManager

# Redirect HTTP → HTTPS
server {
    listen      80;
    server_name _;
    return 301  https://$host$request_uri;
}

server {
    listen      443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cronmanager.crt;
    ssl_certificate_key /etc/nginx/ssl/cronmanager.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HTTP Basic Auth — jedyny punkt wejścia
    auth_basic           "CronManager — Authorized Access Only";
    auth_basic_user_file /etc/nginx/.cronmanager_htpasswd;

    # Security headers
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options           SAMEORIGIN        always;
    add_header X-Content-Type-Options    nosniff           always;
    add_header X-XSS-Protection          "1; mode=block"   always;
    add_header Content-Security-Policy   "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # Pliki statyczne — serwowane bezpośrednio przez nginx
    root  /opt/cronmanager/src/public;
    index index.html;

    # Ograniczenie dostępu do sieci wewnętrznej (odkomentuj i dostosuj)
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public";
    }

    # API — proxy do Node.js
    location /api/ {
        proxy_pass            http://127.0.0.1:3000;
        proxy_http_version    1.1;
        proxy_set_header      Host             $host;
        proxy_set_header      X-Real-IP        $remote_addr;
        proxy_set_header      X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header      X-Authenticated  "true";
        proxy_set_header      X-Remote-User    $remote_user;
        proxy_read_timeout    30s;
        proxy_connect_timeout 5s;

        # Nie cache'uj API responses
        add_header Cache-Control "no-store, no-cache" always;
        expires -1;
    }

    # Blokady — wrażliwe lokalizacje
    location ~ /\.(git|env|json|log)$ { deny all; return 404; }
    location /config/                  { deny all; return 404; }
    location /logs/                    { deny all; return 404; }
    location /scripts/                 { deny all; return 404; }

    # Tylko bezpieczne metody HTTP
    if ($request_method !~ ^(GET|POST|HEAD)$) { return 405; }
}
